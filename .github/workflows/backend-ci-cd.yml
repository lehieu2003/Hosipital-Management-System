name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - node-backend/**
      - deploy/aws/**
      - .github/workflows/backend-ci-cd.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: node-backend
    env:
      NODE_ENV: test
      PORT: 3000
      API_PREFIX: /api/v1
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
      JWT_ACCESS_SECRET: test-access-secret-123456
      JWT_REFRESH_SECRET: test-refresh-secret-123456
      JWT_ACCESS_TTL_MINUTES: 15
      JWT_REFRESH_TTL_DAYS: 7
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hms_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: node-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Build backend
        run: npm run build

  docker-image:
    name: Build and push backend image
    runs-on: ubuntu-latest
    needs: validate
    env:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image coordinates
        id: image
        shell: bash
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/hms-node-backend:sha-${GITHUB_SHA}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          echo "LATEST_IMAGE=ghcr.io/${owner}/hms-node-backend:latest" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        shell: bash
        run: |
          : "${GHCR_TOKEN:?Missing secret GHCR_TOKEN}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -f node-backend/Dockerfile \
            -t "$IMAGE" \
            -t "$LATEST_IMAGE" \
            node-backend

      - name: Push Docker image
        run: |
          docker push "$IMAGE"
          docker push "$LATEST_IMAGE"

  deploy:
    name: Deploy backend to AWS EC2
    runs-on: ubuntu-latest
    needs: docker-image
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      APP_DIR: /home/${{ secrets.AWS_EC2_SSH_USER }}/hms-backend
      SSH_HOST: ${{ secrets.AWS_EC2_SSH_HOST }}
      SSH_PORT: ${{ secrets.AWS_EC2_SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.AWS_EC2_SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.AWS_EC2_SSH_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key
        shell: bash
        run: |
          : "${SSH_HOST:?Missing secret AWS_EC2_SSH_HOST}"
          : "${SSH_USER:?Missing secret AWS_EC2_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing secret AWS_EC2_SSH_PRIVATE_KEY}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/aws_ec2_key
          chmod 600 ~/.ssh/aws_ec2_key
          if [ -z "$SSH_PORT" ]; then
            SSH_PORT=22
          fi
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Copy deployment assets to server
        shell: bash
        run: |
          if [ -z "$SSH_PORT" ]; then
            SSH_PORT=22
          fi
          ssh -i ~/.ssh/aws_ec2_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$APP_DIR'"
          scp -i ~/.ssh/aws_ec2_key -P "$SSH_PORT" \
            deploy/aws/docker-compose.backend.yml \
            deploy/aws/deploy-backend.sh \
            "$SSH_USER@$SSH_HOST:$APP_DIR/"

      - name: Upload backend environment file
        shell: bash
        run: |
          if [ -z "$SSH_PORT" ]; then
            SSH_PORT=22
          fi
          printf '%s' "${{ secrets.BACKEND_ENV_FILE }}" | \
            ssh -i ~/.ssh/aws_ec2_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cat > '$APP_DIR/backend.env'"

      - name: Upload deploy runtime variables
        shell: bash
        run: |
          cat > deploy-runtime.env <<'EOF'
          BACKEND_IMAGE=${{ needs.docker-image.outputs.image }}
          GHCR_USERNAME=${{ github.repository_owner }}
          GHCR_TOKEN=${{ secrets.GHCR_TOKEN }}
          EOF
          if [ -z "$SSH_PORT" ]; then
            SSH_PORT=22
          fi
          scp -i ~/.ssh/aws_ec2_key -P "$SSH_PORT" deploy-runtime.env "$SSH_USER@$SSH_HOST:$APP_DIR/deploy-runtime.env"
          rm -f deploy-runtime.env

      - name: Run remote deployment
        shell: bash
        run: |
          if [ -z "$SSH_PORT" ]; then
            SSH_PORT=22
          fi
          ssh -i ~/.ssh/aws_ec2_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" <<EOF
          set -euo pipefail
          APP_DIR="$APP_DIR"
          chmod +x "$APP_DIR/deploy-backend.sh"
          set -a
          . "$APP_DIR/deploy-runtime.env"
          set +a
          "$APP_DIR/deploy-backend.sh"
          rm -f "$APP_DIR/deploy-runtime.env"
          EOF
