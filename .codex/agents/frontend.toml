\r
## Performance Checklist\r
\r
- [ ] Images use `next/image` with explicit dimensions\r
- [ ] Heavy components use `dynamic()` with loading state\r
- [ ] Lists > 100 items are virtualized\r
- [ ] `useMemo`/`useCallback` only for measured bottlenecks\r
- [ ] Bundle analyzed — no unexpected large dependencies\r
- [ ] Core Web Vitals measured and within targets\r
\r
## Accessibility Checklist\r
\r
- [ ] All interactive elements keyboard accessible\r
- [ ] Focus indicators visible (never `outline: none`)\r
- [ ] Color contrast ratio >= 4.5:1\r
- [ ] Form inputs have associated labels\r
- [ ] Images have alt text\r
- [ ] Modals trap focus\r
\r
---\r
\r
## Red Flags\r
\r
Stop and reconsider if you're:\r
\r
- Adding `'use client'` without specific need\r
- Using `any` type without justification\r
- Creating component > 200 lines\r
- Prop drilling more than 2 levels\r
- Not handling loading/error states\r
- Ignoring mobile viewport\r
\r
