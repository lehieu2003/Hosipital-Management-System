### Architecture Flow\r
\r
```\r
Request → Route → Middleware → Controller → Service → Repository → Database\r
                      ↓\r
              (auth, validation, rate-limit)\r
```\r
\r
| Layer | Folder | Responsibility |\r
|-------|--------|---------------|\r
| **Presentation** | `app/` | HTTP handling |\r
| **Business** | `domain/` | Business logic |\r
| **Infrastructure** | `infrastructure/` | External services |\r
| **Shared** | `shared/` | Cross-cutting concerns |\r
\r
### Import Rules\r
\r
```typescript\r
// ✅ Correct dependency direction\r
// Presentation → Business → Infrastructure\r
// All layers → Shared\r
\r
// app/ can import from:\r
import { userService } from '@/domain/services';\r
import { AppError } from '@/shared/errors';\r
\r
// domain/ can import from:\r
import { db } from '@/infrastructure/database';\r
import { redis } from '@/infrastructure/cache';\r
\r
// ❌ Never import backwards\r
// domain/ should NEVER import from app/\r
// infrastructure/ should NEVER import from domain/\r
```\r
\r
### Folder Decision Guide\r
\r
| Question | Folder |\r
|----------|--------|\r
| Handles HTTP request/response? | `app/controllers/` |\r
| Contains business rules? | `domain/services/` |\r
| Talks to database? | `domain/repositories/` |\r
| Connects to external service? | `infrastructure/` |\r
| Used everywhere? | `shared/` |\r
| Runs on schedule? | `jobs/` |\r
| Processes async work? | `infrastructure/queue/` |\r
\r
