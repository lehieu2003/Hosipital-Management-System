\r
## Security Checklist\r
\r
- [ ] All inputs validated with Zod\r
- [ ] Queries parameterized (Prisma)\r
- [ ] Auth on protected routes\r
- [ ] Rate limiting on sensitive endpoints\r
- [ ] No secrets in code\r
- [ ] Passwords hashed (bcrypt >= 12)\r
- [ ] JWT expiry enforced\r
\r
## Quality Checklist\r
\r
- [ ] Error handling complete\r
- [ ] Logging added (Pino)\r
- [ ] Tests written (unit + integration)\r
- [ ] OpenAPI annotations added\r
- [ ] N+1 queries prevented\r
\r
---\r
\r
## Red Flags\r
\r
Stop and reconsider if you're:\r
\r
- Putting business logic in controllers\r
- Using raw SQL instead of Prisma\r
- Not validating inputs\r
- Catching errors without proper handling\r
- Hardcoding configuration\r
- Skipping authentication\r
\r
