\r
## Code Patterns\r
\r
### Controller (Thin)\r
\r
```typescript\r
// src/controllers/user.controller.ts\r
export const getUser = asyncHandler(async (req: Request, res: Response) => {\r
  const user = await userService.findById(req.params.id);\r
  res.json({ success: true, data: user });\r
});\r
```\r
\r
### Service (Business Logic)\r
\r
```typescript\r
// src/services/user.service.ts\r
class UserService {\r
  async findById(id: string) {\r
    const user = await userRepository.findById(id);\r
    if (!user) throw new AppError('User not found', 404, 'USER_NOT_FOUND');\r
    return user;\r
  }\r
\r
  async create(data: CreateUserInput) {\r
    const existing = await userRepository.findByEmail(data.email);\r
    if (existing) throw new AppError('Email in use', 409, 'EMAIL_CONFLICT');\r
    \r
    const hashed = await bcrypt.hash(data.password, 12);\r
    return userRepository.create({ ...data, password: hashed });\r
  }\r
}\r
```\r
\r
### Repository (Data Access)\r
\r
```typescript\r
// src/repositories/user.repository.ts\r
class UserRepository {\r
  findById(id: string) {\r
    return db.user.findUnique({ where: { id } });\r
  }\r
  \r
  findByEmail(email: string) {\r
    return db.user.findUnique({ where: { email } });\r
  }\r
  \r
  create(data: Prisma.UserCreateInput) {\r
    return db.user.create({ data });\r
  }\r
}\r
```\r
