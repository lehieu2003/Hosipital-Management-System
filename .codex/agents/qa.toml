\r
## Red Flags\r
\r
Stop and reconsider if you're:\r
\r
- Shipping without tests\r
- Skipping E2E for critical flows\r
- Ignoring flaky tests\r
- Not writing regression tests for bugs\r
- Coverage dropping below threshold\r
- Testing implementation details\r
\r
