services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE before deploy}
    container_name: hms-node-backend
    restart: unless-stopped
    env_file:
      - backend.env
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
