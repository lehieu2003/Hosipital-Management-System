\r
### Key Principles\r
\r
| Folder | Purpose | Rule |\r
|--------|---------|------|\r
| `api/` | API calls | All HTTP requests go here |\r
| `components/` | Reusable UI | No business logic |\r
| `features/` | Feature modules | Self-contained, co-located |\r
| `hooks/` | Global hooks | Shared across features |\r
| `stores/` | Global state | Zustand stores |\r
| `services/` | Business logic | Non-UI logic |\r
| `lib/` | Utilities | Pure functions only |\r
\r
### Import Rules\r
\r
```typescript\r
// ✅ Use path aliases (configured in tsconfig.json)\r
import { Button } from '@/components/ui';\r
import { useAuth } from '@/features/auth';\r
import { api } from '@/api';\r
\r
// ✅ Feature imports — use index.ts barrel exports\r
import { LoginForm, useAuth, authStore } from '@/features/auth';\r
\r
// ❌ Avoid deep imports\r
import { LoginForm } from '@/features/auth/components/LoginForm';\r
\r
// ✅ Relative imports only within same feature\r
// Inside features/auth/components/LoginForm.tsx:\r
import { useAuth } from '../hooks/useAuth';\r
```\r
\r
### Folder Decision Guide\r
\r
| Question | Folder |\r
|----------|--------|\r
| Makes HTTP calls? | `api/` |\r
| Reused across features? | `components/` |\r
| Belongs to one feature? | `features/[name]/components/` |\r
| Global state? | `stores/` |\r
| Feature-specific state? | `features/[name]/stores/` |\r
| Shared custom hook? | `hooks/` |\r
| Feature-specific hook? | `features/[name]/hooks/` |\r
| Pure utility function? | `lib/` |\r
| Business logic (non-UI)? | `services/` |\r
| TypeScript types? | `types/` or `features/[name]/types/` |\r
\r
### Component Template\r
\r
```tsx\r
import type { FC } from 'react';\r
import { cn } from '@/lib/utils';\r
\r
interface ButtonProps {\r
  children: React.ReactNode;\r
  variant?: 'primary' | 'secondary' | 'ghost';\r
  size?: 'sm' | 'md' | 'lg';\r
  disabled?: boolean;\r
  onClick?: () => void;\r
  className?: string;\r
}\r
\r
export const Button: FC<ButtonProps> = ({\r
  children,\r
  variant = 'primary',\r
  size = 'md',\r
  disabled = false,\r
  onClick,\r
  className,\r
}) => {\r
  return (\r
    <button\r
      type="button"\r
      onClick={onClick}\r
      disabled={disabled}\r
      className={cn(\r
        'inline-flex items-center justify-center rounded-md font-medium transition-colors',\r
        'focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2',\r
        variant === 'primary' && 'bg-primary text-primary-foreground hover:bg-primary/90',\r
        variant === 'secondary' && 'border bg-background hover:bg-muted',\r
        variant === 'ghost' && 'hover:bg-muted',\r
        size === 'sm' && 'h-8 px-3 text-sm',\r
        size === 'md' && 'h-10 px-4',\r
        size === 'lg' && 'h-12 px-6 text-lg',\r
        disabled && 'pointer-events-none opacity-50',\r
        className\r
      )}\r
    >\r
      {children}\r
    </button>\r
  );\r
};\r
```\r
\r
### Server vs Client Components\r
\r
```tsx\r
// Default: Server Component (no directive)\r
// Use for: data fetching, static content, layouts\r
\r
// Client Component: only when needed\r
'use client';\r
// Use for: useState, useEffect, event handlers, browser APIs\r
```\r
\r
---\r
\r
## Data Fetching Patterns\r
\r
### Server Component (Preferred)\r
\r
```tsx\r
async function UserProfile({ userId }: { userId: string }) {\r
  const user = await db.user.findUnique({ where: { id: userId } });\r
  if (!user) notFound();\r
  return <ProfileCard user={user} />;\r
}\r
```\r
\r
### Client Component (TanStack Query)\r
\r
```tsx\r
'use client';\r
\r
const { data, isLoading, error } = useQuery({\r
  queryKey: ['user', userId],\r
  queryFn: () => api.users.getById(userId),\r
  staleTime: 60_000,\r
});\r
\r
if (isLoading) return <ProfileSkeleton />;\r
if (error) return <ErrorState onRetry={refetch} />;\r
return <ProfileCard user={data} />;\r
```\r
\r
---\r
\r
## Form Pattern\r
\r
```tsx\r
'use client';\r
\r
import { useForm } from 'react-hook-form';\r
import { zodResolver } from '@hookform/resolvers/zod';\r
import { z } from 'zod';\r
\r
const schema = z.object({\r
  email: z.string().email('Enter a valid email'),\r
  password: z.string().min(8, 'Password must be at least 8 characters'),\r
});\r
\r
type FormData = z.infer<typeof schema>;\r
\r
export function LoginForm() {\r
  const { register, handleSubmit, formState: { errors, isSubmitting } } = useForm<FormData>({\r
    resolver: zodResolver(schema),\r
  });\r
\r
  const onSubmit = async (data: FormData) => {\r
    await signIn(data);\r
  };\r
\r
  return (\r
    <form onSubmit={handleSubmit(onSubmit)} noValidate>\r
      <div>\r
        <label htmlFor="email">Email</label>\r
        <input id="email" type="email" {...register('email')} aria-invalid={!!errors.email} />\r
        {errors.email && <p role="alert">{errors.email.message}</p>}\r
      </div>\r
      <button type="submit" disabled={isSubmitting}>\r
        {isSubmitting ? 'Signing in...' : 'Sign in'}\r
      </button>\r
    </form>\r
  );\r
}\r
```\r
