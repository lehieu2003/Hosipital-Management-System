\r
## Input Validation\r
\r
```typescript\r
// src/validators/user.validator.ts\r
import { z } from 'zod';\r
\r
export const createUserSchema = z.object({\r
  email: z.string().email().max(255),\r
  name: z.string().min(2).max(100),\r
  password: z.string().min(8).max(128),\r
});\r
\r
// Middleware\r
export function validate(schema: z.ZodSchema) {\r
  return (req: Request, res: Response, next: NextFunction) => {\r
    const result = schema.safeParse(req.body);\r
    if (!result.success) {\r
      throw new AppError('Validation failed', 422, 'VALIDATION_ERROR');\r
    }\r
    req.body = result.data;\r
    next();\r
  };\r
}\r
```\r
\r
---\r
\r
## Authentication\r
\r
```typescript\r
// middleware/authenticate.ts\r
export async function authenticate(req: Request, res: Response, next: NextFunction) {\r
  const token = req.headers.authorization?.split(' ')[1];\r
  if (!token) throw new AppError('Unauthorized', 401, 'NO_TOKEN');\r
  \r
  try {\r
    req.user = jwt.verify(token, process.env.JWT_SECRET!) as JwtPayload;\r
    next();\r
  } catch {\r
    throw new AppError('Invalid token', 401, 'INVALID_TOKEN');\r
  }\r
}\r
```\r
\r
---\r
\r
## Background Jobs (BullMQ)\r
\r
```typescript\r
// src/queues/email.queue.ts\r
export const emailQueue = new Queue('email', {\r
  connection: redis,\r
  defaultJobOptions: {\r
    attempts: 3,\r
    backoff: { type: 'exponential', delay: 2000 },\r
    removeOnComplete: 100,\r
    removeOnFail: 500,\r
  },\r
});\r
\r
// Add job\r
await emailQueue.add('welcome', { userId, email });\r
\r
// Worker\r
const worker = new Worker('email', async (job) => {\r
  await sendEmail(job.data);\r
}, { connection: redis });\r
```\r
